name: Monitor de precos (Terabyte -> Telegram)

on:
  schedule:
    # A cada 30 min. GitHub pode atrasar alguns minutos (normal).
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # permite rodar na mao pelo botao "Run workflow"

# Evita duas execucoes simultaneas
concurrency:
  group: monitor-precos
  cancel-in-progress: false

permissions:
  contents: write   # salva o historico de precos de volta no repositorio

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm install

      - name: Instalar Chrome headless
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq google-chrome-stable || echo "apt falhou, tentando .deb direto"
          if ! command -v google-chrome-stable >/dev/null 2>&1; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y -qq /tmp/chrome.deb
          fi
          echo "== versao =="
          google-chrome-stable --version || echo "CHROME NAO INSTALOU"
          echo "== caminho =="
          command -v google-chrome-stable || echo "SEM CAMINHO"

      - name: Diagnostico do ambiente
        run: |
          echo "node: $(node -v)"
          echo "sistema: $(uname -sm)"
          ls -la /usr/bin/google-chrome-stable || echo "SEM /usr/bin/google-chrome-stable"
          node -e "console.log('puppeteer-core', require('puppeteer-core/package.json').version)"

      - name: Checar precos
        env:
          CHROME_PATH: /usr/bin/google-chrome-stable
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALVO_R$: ${{ vars.ALVO_RS }}
        run: node monitor.js

      - name: Salvar historico de precos
        if: always()
        run: |
          git config user.name "monitor-precos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ || true
          if git diff --quiet --cached; then
            echo "sem mudanca no historico"
          else
            git commit -m "chore: atualizar historico de precos [skip ci]"
            git pull --rebase --autostash || true
            git push || echo "push falhou - verifique Workflow permissions: Read and write"
          fi
